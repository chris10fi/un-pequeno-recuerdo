<script>

function normalize(text) {
  return text
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

function normalizeDate(text) {
  let value = normalize(text);

  const months = {
    enero: "01",
    febrero: "02",
    marzo: "03",
    abril: "04",
    mayo: "05",
    junio: "06",
    julio: "07",
    agosto: "08",
    septiembre: "09",
    setiembre: "09",
    octubre: "10",
    noviembre: "11",
    diciembre: "12"
  };

  Object.keys(months).forEach(month => {
    value = value.replace(new RegExp(month, "g"), months[month]);
  });

  value = value
    .replace(/\bdel\b/g, "")
    .replace(/\bde\b/g, "")
    .replace(/[\/\-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  return value;
}

function checkAnswers() {

  const a1 = normalize(document.getElementById("q1").value);
  const a2 = normalizeDate(document.getElementById("q2").value);
  const a3 = normalize(document.getElementById("q3").value);
  const a4 = normalize(document.getElementById("q4").value);
  const a5 = normalize(document.getElementById("q5").value);

  const correct1 = normalize("Yoandra Jazmin Monroy Urbina");
  const correct2 = normalizeDate("19 de enero del 2007");
  const correct3 = normalize("kiwi");
  const correct4 = normalize("deslactosada");
  const correct5 = normalize("lirios");

  if (
    a1 === correct1 &&
    a2 === correct2 &&
    a3 === correct3 &&
    a4 === correct4 &&
    a5 === correct5
  ) {

    document.getElementById("formSection").style.display = "none";
    document.getElementById("success").style.display = "block";

  } else {

    document.getElementById("error").style.display = "block";

  }
}

</script>
