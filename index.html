<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un pequeño recuerdo</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #fdf6f8, #f8eef2);
      color: #4a3a40;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px 24px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
      font-weight: normal;
    }
    .description {
      text-align: center;
      font-size: 16px;
      color: #77666d;
      margin-bottom: 30px;
      font-style: italic;
    }
    .question {
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-bottom: 9px;
      font-size: 16px;
      line-height: 1.4;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8cbd0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #a98995;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #8d6876;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin-top: 5px;
    }
    button:hover {
      opacity: 0.9;
    }
    .error {
      display: none;
      text-align: center;
      margin-top: 18px;
      color: #9a5365;
      font-size: 15px;
    }
    .success {
      display: none;
      text-align: center;
    }
    .success h2 {
      font-weight: normal;
      font-size: 25px;
      margin-bottom: 15px;
    }
    .success p {
      font-size: 17px;
      line-height: 1.6;
    }
    .letter-button {
      display: inline-block;
      text-decoration: none;
      margin-top: 18px;
      padding: 13px 25px;
      border-radius: 12px;
      background: #8d6876;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="formSection">
      <h1>Un pequeño recuerdo</h1>
      <div class="description">
        Recordando pequeños detalles de ti. ❤️
      </div>
      <div class="question">
        <label>1. Empecemos por algo sencillo… escribe tu nombre completo. ❤️</label>
        <input type="text" id="q1">
      </div>
      <div class="question">
        <label>2. ¿Qué fecha marca el día en que llegaste al mundo?</label>
        <input type="text" id="q2">
      </div>
      <div class="question">
        <label>3. Si tuvieras que elegir una fruta para comer ahora mismo, ¿cuál escogerías?</label>
        <input type="text" id="q3">
      </div>
      <div class="question">
        <label>4. Cuando te preparas un café, ¿qué tipo de leche eliges: deslactosada o entera?</label>
        <input type="text" id="q4">
      </div>
      <div class="question">
        <label>5. Antes de dejarte pasar… hay algo que debería recordar de ti. ¿Cuál es tu flor favorita? 🌷</label>
        <input type="text" id="q5">
      </div>
      <button onclick="checkAnswers()">Continuar</button>
      <div class="error" id="error">
        Mmm… parece que algo no coincide. Inténtalo nuevamente. ❤️
      </div>
    </div>
    <div class="success" id="success">
      <h2>Aún recuerdo esos pequeños detalles de ti. ❤️</h2>
      <p>
        Gracias por tomarte el tiempo de responder.
      </p>
      <a class="letter-button" href="#" id="letterLink">
        Abrir carta
      </a>
    </div>
  </div>
  <script>
    function normalize(text) {
      return text
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }
    function normalizeDate(text) {
      let value = normalize(text);
      const months = {
        enero: "01",
        febrero: "02",
        marzo: "03",
        abril: "04",
        mayo: "05",
        junio: "06",
        julio: "07",
        agosto: "08",
        septiembre: "09",
        setiembre: "09",
        octubre: "10",
        noviembre: "11",
        diciembre: "12"
      };
      Object.keys(months).forEach(month => {
        value = value.replace(
          new RegExp(month, "g"),
          months[month]
        );
      });
      value = value
        .replace(/\bdel\b/g, "")
        .replace(/\bde\b/g, "")
        .replace(/[\/\-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      const parts = value.split(" ");
      if (parts.length === 3) {
        return (
          parts[0].padStart(2, "0") + " " +
          parts[1].padStart(2, "0") + " " +
          parts[2]
        );
      }
      return value;
    }
    function checkAnswers() {
      const a1 = normalize(
        document.getElementById("q1").value
      );
      const a2 = normalizeDate(
        document.getElementById("q2").value
      );
      const a3 = normalize(
        document.getElementById("q3").value
      );
      const a4 = normalize(
        document.getElementById("q4").value
      );
      const a5 = normalize(
        document.getElementById("q5").value
      );
      const correct1 = normalize(
        "Yoandra Jazmin Monroy Urbina"
      );
      const correct2 = normalizeDate(
        "19 de enero del 2007"
      );
      const fruitOptions = [
        "kiwi",
        "kiwis"
      ];
      const milkOptions = [
        "deslactosada",
        "entera"
      ];
      const flowerOptions = [
        "lirio",
        "lirios"
      ];
      const nameCorrect =
        a1 === correct1;
      const dateCorrect =
        a2 === correct2;
      const fruitCorrect =
        fruitOptions.includes(a3);
      const milkCorrect =
        milkOptions.includes(a4);
      const flowerCorrect =
        flowerOptions.includes(a5);
      if (
        nameCorrect &&
        dateCorrect &&
        fruitCorrect &&
        milkCorrect &&
        flowerCorrect
      ) {
        document.getElementById("formSection").style.display = "none";
        document.getElementById("success").style.display = "block";
      } else {
        document.getElementById("error").style.display = "block";
      }
    }
  </script>
</body>
</html>
